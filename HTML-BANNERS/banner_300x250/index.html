<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=300,height=250">
    <title>HTML5 AI Banner 300x250</title>
    
    <!-- Google Ads / DV360 ClickTag -->
    <script type="text/javascript">
        var clickTag = "https://spirik-a.github.io/SPIRIDONOV_PORTFOLIO26/";
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        #banner {
            width: 300px;
            height: 250px;
            position: relative;
            overflow: hidden;
            background-color: #0d0f12;
            font-family: 'Segoe UI', Roboto, sans-serif;
            cursor: pointer;
        }

        /* AI Background Layer */
        .bg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(120,40,250,0.4) 0%, rgba(13,15,18,0.85) 90%),
                        url('assets/bg_ai.jpg') center/cover no-repeat;
            animation: zoomBg 8s infinite alternate ease-in-out;
        }

        /* Content Layout */
        .content {
            position: relative;
            z-index: 2;
            padding: 18px;
            color: #ffffff;
        }

        /* Logo Style */
        .logo {
            width: 28px;
            height: 28px;
            display: block;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #00f0ff;
            margin-bottom: 8px;
        }

        .title {
            font-size: 22px;
            line-height: 1.1;
            font-weight: 900;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 16px;
        }

        /* CTA Button */
        .cta-btn {
            display: inline-block;
            padding: 9px 16px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .border {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
            z-index: 10;
        }

        /* Keyframe Animations */
        @keyframes zoomBg {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .slide-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }

        .fade-in-delay {
            animation: fadeIn 1s ease 0.3s forwards;
            opacity: 0;
        }

        .pulse {
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
    </style>
</head>
<body>
    <div id="banner">
        <!-- Background -->
        <div class="bg-layer"></div>
        
        <!-- Content -->
        <div class="content">
            <img src="assets/logo.png" alt="Logo" class="logo fade-in">
            <div class="badge fade-in">AI POWERED</div>
            <h1 class="title slide-up">NEXT-GEN<br>CREATIVES</h1>
            <p class="subtitle fade-in-delay">Boost your CTR by 300%</p>
            <div class="cta-btn pulse">ДІЗНАТИСЯ БІЛЬШЕ</div>
        </div>

        <!-- Border -->
        <div class="border"></div>
    </div>

    <!-- JS Logic -->
    <script src="script.js"></script>
</body>
</html>
