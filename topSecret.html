    <script>
      // 1. Перевірка паролю (запускається одразу до рендеру контенту)
      const CORRECT_PASSWORD = "saisec26#"; //   FN пароль
      let authenticated = false;

      while (!authenticated) {
        let passwordInput = prompt(
          "Будь ласка, введіть пароль для доступу до сторінки:"
        );

        if (passwordInput === null) {
          alert("Доступ відхилено.");
          window.stop();
          document.body.innerHTML =
            "<h2 style='text-align:center; padding-top:50px;'>Доступ обмежено. Необхідний пароль.</h2>";
          document.body.style.display = "block";
          break;
        }

        if (passwordInput === CORRECT_PASSWORD) {
          authenticated = true;
          document.body.style.display = "flex"; // Показуємо сторінку
        } else {
          alert("Невірний пароль! Спробуйте ще раз.");
        }
      }

      // 2. Захист коду сторінки та блокування інспектора
      document.onkeydown = function (e) {
        if (
          e.ctrlKey &&
          (e.keyCode === 83 ||
            e.keyCode === 85 ||
            e.keyCode === 123 ||
            e.keyCode === 73)
        ) {
          return false;
        }
      };

      // 3. Логіка відео-плеєрів (робота з кадрами)
      document.querySelectorAll(".video-container").forEach((container) => {
        const video = container.querySelector("video");

        // Зупинка відео за 0.8 сек до кінця на потрібному кадрі
        video.addEventListener("timeupdate", () => {
          if (video.duration && video.currentTime >= video.duration - 0.8) {
            video.pause();
            video.currentTime = video.duration - 0.8;
          }
        });

        // Якщо відео додивилися до кінця і знову тиснуть плей — воно почнеться спочатку
        video.addEventListener("play", () => {
          if (video.currentTime >= video.duration - 0.85) {
            video.currentTime = 0;
          }
        });
      });
    </script>
